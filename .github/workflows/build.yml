name: Build Astro Stacker (Ryzen 5600 + RTX 3050)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install OpenCV via Chocolatey
      run: choco install opencv -y

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -A x64 -DOpenCV_DIR="C:/tools/opencv/build"

    - name: Build Executable (MSVC)
      run: cmake --build build --config Release --parallel

    - name: Bundle DLLs and Assets for Standalone Portable Package
      shell: cmd
      run: |
        copy C:\tools\opencv\build\x64\vc16\bin\opencv_world*.dll build\Release\
        copy index.html build\Release\
        copy launch_gui.bat build\Release\

    - name: Upload Windows Executable (Portable Package)
      uses: actions/upload-artifact@v4
      with:
        name: AstroStacker-Portable-Windows
        path: |
          build/Release/astro_stacker.exe
          build/Release/*.dll
          build/Release/index.html
          build/Release/launch_gui.bat

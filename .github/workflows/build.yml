name: Build Astro Stacker (Ryzen 5600 + RTX 3050)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install OpenCV via Chocolatey
      run: choco install opencv -y

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -A x64 -DOpenCV_DIR="C:/tools/opencv/build"

    - name: Build Executable (MSVC)
      run: cmake --build build --config Release --parallel

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: AstroStacker-Ryzen5600-RTX3050
        path: build/Release/astro_stacker.exe
